<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Calendar</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e3e5e9;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --today-ring: #4f46e5;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --surface: #1e2127;
      --border: #2c2f36;
      --text: #e6e7ea;
      --text-muted: #9aa0aa;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --today-ring: #818cf8;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .month-nav h1 {
    font-size: 22px;
    font-weight: 650;
    min-width: 200px;
    margin: 0;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 16px;
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--border); }
  .today-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 14px;
    height: 34px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
  }
  .today-btn:hover { background: var(--border); }
  .primary-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    height: 36px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
  }
  .primary-btn:hover { background: var(--accent-hover); }

  .toolbar-right { display: flex; align-items: center; gap: 10px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .legend-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-add {
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12.5px;
  }
  .legend-add:hover { color: var(--text); border-color: var(--text-muted); }

  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .weekday-row div {
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-muted);
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .day-cell {
    min-height: 108px;
    min-width: 0;
    overflow: hidden;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: background .12s;
  }
  .day-cell:hover { background: rgba(79,70,229,0.05); }
  .day-cell:nth-child(7n) { border-right: none; }
  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .day-cell.other-month .day-num { color: var(--text-muted); opacity: .5; }
  .day-cell.today .day-num {
    background: var(--today-ring);
    color: white;
  }
  .events-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
    min-width: 0;
  }
  .event-pill {
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 5px;
    color: white;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    width: 100%;
  }
  .event-pill:hover { filter: brightness(1.08); }
  .event-pill-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .event-pill.completed { opacity: .6; }
  .event-pill.completed .event-pill-text { text-decoration: line-through; }
  .event-check {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,.9);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    line-height: 1;
    color: white;
    cursor: pointer;
  }
  .more-link {
    font-size: 11px;
    color: var(--text-muted);
    padding: 1px 6px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
    padding: 20px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
  }
  .modal h2 {
    margin: 0 0 16px;
    font-size: 17px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .field input[type=text], .field input[type=date], .field input[type=time], .field select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }

  .color-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .color-swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
  }
  .color-swatch.selected { border-color: var(--text); }

  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 8px;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 13.5px;
    font-weight: 600;
    padding: 6px 4px;
  }
  .right-actions { display: flex; gap: 8px; }
  .cancel-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .save-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .save-btn:hover { background: var(--accent-hover); }

  .cat-name-new {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .cat-name-new input {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .small-add-btn {
    background: var(--border);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }

  @media (max-width: 640px) {
    .day-cell { min-height: 78px; }
    .month-nav h1 { font-size: 18px; min-width: unset; }
    .weekday-row div { font-size: 10px; }
  }

  /* Day view */
  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .day-header-left { display: flex; align-items: center; gap: 10px; }
  .day-header-left h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .day-content {
    display: flex;
    gap: 16px;
  }
  .day-schedule {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    position: relative;
    overflow-y: auto;
    max-height: 65vh;
    flex: 1;
    min-width: 0;
  }
  .hour-row {
    display: flex;
    height: 60px;
    border-bottom: 1px solid var(--border);
  }
  .hour-row:last-child { border-bottom: none; }
  .hour-label {
    width: 64px;
    flex-shrink: 0;
    text-align: right;
    padding: 4px 10px 0 0;
    font-size: 11px;
    color: var(--text-muted);
  }
  .hour-slot {
    flex: 1;
    cursor: pointer;
    transition: background .12s;
  }
  .hour-slot:hover { background: rgba(79,70,229,0.06); }
  .day-events-layer {
    position: absolute;
    top: 0;
    left: 64px;
    right: 8px;
    bottom: 0;
    pointer-events: none;
  }
  .day-event-block {
    position: absolute;
    left: 4px;
    right: 4px;
    min-height: 22px;
    padding: 3px 8px;
    border-radius: 6px;
    color: white;
    overflow: hidden;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .day-event-block:hover { filter: brightness(1.08); }
  .day-event-block.completed { opacity: .6; }
  .day-event-block-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .day-event-block.completed .day-event-block-title { text-decoration: line-through; }
  .day-event-block-location {
    font-size: 10.5px;
    opacity: .85;
    padding-left: 18px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .input-error { outline: 2px solid #ef4444 !important; outline-offset: -1px; }

  .tasks-panel {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    max-height: 65vh;
    display: flex;
    flex-direction: column;
  }
  .tasks-panel h3 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 650;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .tasks-input-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .tasks-input-row input {
    flex: 1;
    min-width: 0;
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .tasks-input-row input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .tasks-input-row button {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tasks-input-row button:hover { background: var(--accent-hover); }
  .tasks-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 2px;
  }
  .task-check {
    width: 14px;
    height: 14px;
    margin-top: 2px;
    flex-shrink: 0;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: white;
    cursor: pointer;
  }
  .task-item.completed .task-check { background: var(--accent); border-color: var(--accent); }
  .task-text {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
    cursor: pointer;
  }
  .task-item.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
  .task-delete {
    flex-shrink: 0;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    padding: 0 2px;
  }
  .task-delete:hover { color: #ef4444; }
  .tasks-empty {
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 2px;
  }

  @media (max-width: 640px) {
    .day-content { flex-direction: column; }
    .tasks-panel { width: 100%; max-height: none; }
  }

  .repeat-days {
    display: flex;
    gap: 6px;
  }
  .repeat-day-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .repeat-day-btn.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .repeat-hint {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="app">
  <div id="monthView">
    <header class="topbar">
      <div class="month-nav">
        <button class="icon-btn" id="prevBtn">‹</button>
        <button class="icon-btn" id="nextBtn">›</button>
        <h1 id="monthLabel"></h1>
      </div>
      <div class="toolbar-right">
        <button class="today-btn" id="todayBtn">Today</button>
        <button class="primary-btn" id="newEventBtn">+ New Event</button>
      </div>
    </header>

    <div class="legend" id="legend"></div>

    <div class="calendar">
      <div class="weekday-row">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div id="dayView" style="display:none;">
    <div class="day-header">
      <div class="day-header-left">
        <button class="icon-btn" id="dayBackBtn">‹</button>
        <h2 id="dayViewTitle"></h2>
      </div>
      <button class="primary-btn" id="dayAddEventBtn">+ Add Event</button>
    </div>
    <div class="day-content">
      <div class="day-schedule" id="daySchedule"></div>
      <div class="tasks-panel">
        <h3>Tasks</h3>
        <div class="tasks-input-row">
          <input type="text" id="taskInput" placeholder="Add a task…" />
          <button id="addTaskBtn">+</button>
        </div>
        <div class="tasks-list" id="tasksList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Event Modal -->
<div class="overlay" id="eventOverlay">
  <div class="modal">
    <h2 id="eventModalTitle">New Event</h2>
    <input type="hidden" id="eventId" />
    <div class="field">
      <label>Title / Class</label>
      <input type="text" id="eventTitle" placeholder="e.g. CS 146 - Lecture" />
    </div>
    <div class="row2">
      <div class="field">
        <label>Date</label>
        <input type="date" id="eventDate" />
      </div>
      <div class="field">
        <label>Start Time</label>
        <input type="time" id="eventTime" required />
      </div>
    </div>
    <div class="field">
      <label>End Time <span style="font-weight:400; text-transform:none; letter-spacing:normal;">(optional)</span></label>
      <input type="time" id="eventEndTime" />
    </div>
    <div class="field" id="repeatField">
      <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <input type="checkbox" id="eventRepeat" style="width:16px; height:16px; margin:0;" />
        <span style="font-size:13.5px; font-weight:500; color:var(--text); text-transform:none; letter-spacing:normal;">Repeat weekly</span>
      </label>
      <div id="repeatOptions" style="display:none;">
        <div class="repeat-days" id="repeatDays"></div>
        <div class="field" style="margin-top:10px; margin-bottom:0;">
          <label>Repeat until</label>
          <input type="date" id="repeatUntil" />
        </div>
        <div class="repeat-hint" id="repeatHint"></div>
      </div>
    </div>

    <div class="field">
      <label>Category</label>
      <div class="color-options" id="eventColorOptions"></div>
    </div>

    <div class="field" id="classLocationField" style="display:none;">
      <label>Building / Room</label>
      <input type="text" id="eventClassLocation" list="sjsuLocations" placeholder="e.g. MacQuarrie Hall 234" />
      <datalist id="sjsuLocations">
        <option value="MacQuarrie Hall">
        <option value="Engineering Building">
        <option value="Boccardo Business Complex">
        <option value="Clark Hall">
        <option value="Duncan Hall">
        <option value="Dwight Bentel Hall">
        <option value="Sweeney Hall">
        <option value="Washington Square Hall">
        <option value="Hugh Gillis Hall">
        <option value="Science Building">
        <option value="Central Classroom Building">
        <option value="Yoshihiro Uchida Hall">
        <option value="Student Union">
        <option value="Dr. Martin Luther King Jr. Library">
        <option value="Spartan Recreation and Aquatic Center">
        <option value="Campus Village">
      </datalist>
    </div>
    <div class="field" id="examField" style="display:none; align-items:center; gap:8px;">
      <input type="checkbox" id="eventIsExam" style="width:16px; height:16px; margin:0;" />
      <label for="eventIsExam" style="margin:0; font-size:13.5px; font-weight:500; color:var(--text);">Exam today (highlight in red)</label>
    </div>

    <div class="field" id="dropdownLocationField" style="display:none;">
      <label id="dropdownLocationLabel">Location</label>
      <select id="eventLocationSelect"></select>
    </div>
    <div class="field" id="otherLocationField" style="display:none;">
      <label>Specify location</label>
      <input type="text" id="eventOtherLocation" placeholder="Enter location" />
    </div>

    <div class="field" id="errandDescField" style="display:none;">
      <label>Description</label>
      <input type="text" id="eventErrandDesc" placeholder="e.g. Grocery shopping, pick up package" />
    </div>

    <div class="field" id="genericLocationField" style="display:none;">
      <label>Location</label>
      <input type="text" id="eventGenericLocation" placeholder="e.g. Location or notes" />
    </div>

    <div class="field" style="display:flex; align-items:center; gap:8px; margin-bottom:0;">
      <input type="checkbox" id="eventCompleted" style="width:16px; height:16px; margin:0;" />
      <label for="eventCompleted" style="margin:0; font-size:13.5px; font-weight:500; color:var(--text);">Mark as completed</label>
    </div>
    <div class="modal-actions">
      <div style="display:flex; gap:12px; align-items:center;">
        <button class="delete-btn" id="deleteEventBtn" style="visibility:hidden;">Delete</button>
        <button class="delete-btn" id="deleteSeriesBtn" style="display:none;">Delete series</button>
      </div>
      <div class="right-actions">
        <button class="cancel-btn" id="cancelEventBtn">Cancel</button>
        <button class="save-btn" id="saveEventBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- New Category Modal -->
<div class="overlay" id="catOverlay">
  <div class="modal">
    <h2>New Category</h2>
    <div class="field">
      <label>Name</label>
      <input type="text" id="catName" placeholder="e.g. Health" />
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-options" id="catColorOptions"></div>
    </div>
    <div class="modal-actions">
      <div></div>
      <div class="right-actions">
        <button class="cancel-btn" id="cancelCatBtn">Cancel</button>
        <button class="save-btn" id="saveCatBtn">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  const STORAGE_KEY = "my-calendar-data-v1";
  const PALETTE = [
    "#4f46e5", "#0ea5e9", "#10b981", "#f59e0b",
    "#ef4444", "#ec4899", "#8b5cf6", "#14b8a6",
    "#f97316", "#6366f1"
  ];

  const DEFAULT_CATEGORIES = [
    { id: "class", name: "Class", color: "#4f46e5" },
    { id: "gym", name: "Gym", color: "#10b981" },
    { id: "practice", name: "Practice", color: "#f59e0b" },
    { id: "study", name: "Study", color: "#8b5cf6" },
    { id: "errands", name: "Errands", color: "#0ea5e9" }
  ];

  const EXAM_COLOR = "#ef4444";

  const CATEGORY_SELECT_OPTIONS = {
    gym: ["SRAC", "Grad Gym", "Planet Fitness", "24 Hour Fitness", "Other"],
    practice: ["FICC", "Strikers", "Emerald Glen", "US Cricket Store", "Cricket Champs", "Elite Indoor", "Seabreeze", "Other"],
    study: ["Library", "Home", "Apartment", "Other"]
  };

  function getEventColor(ev) {
    if (ev.categoryId === "class" && ev.isExam) return EXAM_COLOR;
    return categoryById(ev.categoryId).color;
  }

  // SJSU academic calendar (first/last day of instruction) used to default
  // the "repeat until" date for weekly-recurring events like classes.
  const SJSU_SEMESTERS = [
    { start: "2026-08-19", end: "2026-12-07" }, // Fall 2026
    { start: "2027-01-27", end: "2027-05-17" }  // Spring 2027
  ];

  // Days within those semesters with no class, per SJSU's official academic
  // calendar — used to skip holidays/breaks when repeating Class events.
  const SJSU_NO_CLASS_DATES = new Set([
    "2026-09-07", // Labor Day
    "2026-11-11", // Veteran's Day
    "2026-11-25", // Non-Instructional Day
    "2026-11-26", // Thanksgiving Holiday
    "2026-11-27", // Rescheduled Holiday
    "2027-03-29", // Spring Recess
    "2027-03-30", // Spring Recess
    "2027-03-31", // Spring Recess / Cesar Chavez Day
    "2027-04-01", // Spring Recess
    "2027-04-02"  // Spring Recess
  ]);

  function getDefaultRepeatUntil(dateStr) {
    if (!dateStr) return "";
    const sem = SJSU_SEMESTERS.find(s => dateStr >= s.start && dateStr <= s.end);
    if (sem) return sem.end;
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + 105); // fallback: ~15 weeks out
    return fmtDateKey(d);
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.categories) && Array.isArray(parsed.events)) {
          if (!Array.isArray(parsed.tasks)) parsed.tasks = [];
          return parsed;
        }
      }
    } catch (e) {}
    return { categories: DEFAULT_CATEGORIES.slice(), events: [], tasks: [] };
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("Could not persist calendar data:", e);
    }
  }

  let state = loadData();
  let viewDate = new Date();
  viewDate.setDate(1);

  function fmtDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function todayKey() {
    return fmtDateKey(new Date());
  }

  function generateSeriesDates(startDateStr, untilDateStr, daysSet, skipHolidays) {
    const dates = [];
    const start = new Date(startDateStr + "T00:00:00");
    const until = new Date((untilDateStr || startDateStr) + "T00:00:00");
    if (until < start || daysSet.size === 0) return [startDateStr];
    const cursor = new Date(start);
    while (cursor <= until) {
      const key = fmtDateKey(cursor);
      if (daysSet.has(cursor.getDay()) && !(skipHolidays && SJSU_NO_CLASS_DATES.has(key))) {
        dates.push(key);
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    return dates.length ? dates : [startDateStr];
  }

  function categoryById(id) {
    return state.categories.find(c => c.id === id) || state.categories[0];
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function toggleCompleted(id) {
    const ev = state.events.find(e => e.id === id);
    if (!ev) return;
    ev.completed = !ev.completed;
    saveData();
    renderCalendar();
    if (currentDayKey) renderDaySchedule(currentDayKey);
  }

  // ---------- Rendering ----------
  const monthLabel = document.getElementById("monthLabel");
  const grid = document.getElementById("grid");
  const legend = document.getElementById("legend");

  function renderLegend() {
    legend.innerHTML = "";
    state.categories.forEach(cat => {
      const chip = document.createElement("div");
      chip.className = "legend-chip";
      chip.innerHTML = `<span class="legend-dot" style="background:${cat.color}"></span>${cat.name}`;
      legend.appendChild(chip);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "legend-add";
    addBtn.textContent = "+ Category";
    addBtn.addEventListener("click", openCatModal);
    legend.appendChild(addBtn);
  }

  function renderCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    monthLabel.textContent = `${monthNames[month]} ${year}`;

    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = firstOfMonth.getDay();
    const gridStart = new Date(year, month, 1 - startWeekday);

    grid.innerHTML = "";
    const tKey = todayKey();

    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const key = fmtDateKey(cellDate);
      const isOtherMonth = cellDate.getMonth() !== month;

      const cell = document.createElement("div");
      cell.className = "day-cell" + (isOtherMonth ? " other-month" : "") + (key === tKey ? " today" : "");
      cell.dataset.date = key;

      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = cellDate.getDate();
      cell.appendChild(num);

      const evList = document.createElement("div");
      evList.className = "events-list";

      const dayEvents = state.events
        .filter(e => e.date === key)
        .sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));

      const maxShow = 3;
      dayEvents.slice(0, maxShow).forEach(ev => {
        const pill = document.createElement("div");
        pill.className = "event-pill" + (ev.completed ? " completed" : "");
        pill.style.background = getEventColor(ev);
        pill.title = ev.title + (ev.location ? ` — ${ev.location}` : "");

        const check = document.createElement("span");
        check.className = "event-check";
        check.textContent = ev.completed ? "✓" : "";
        check.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleCompleted(ev.id);
        });
        pill.appendChild(check);

        const text = document.createElement("span");
        text.className = "event-pill-text";
        const timeLabel = ev.time ? (ev.time + (ev.endTime ? "–" + ev.endTime : "")) : "";
        text.textContent = (timeLabel ? timeLabel + " " : "") + ev.title;
        pill.appendChild(text);

        pill.addEventListener("click", (e) => {
          e.stopPropagation();
          openEventModal(key, ev.id);
        });
        evList.appendChild(pill);
      });

      if (dayEvents.length > maxShow) {
        const more = document.createElement("div");
        more.className = "more-link";
        more.textContent = `+${dayEvents.length - maxShow} more`;
        more.addEventListener("click", (e) => {
          e.stopPropagation();
          openDayView(key);
        });
        evList.appendChild(more);
      }

      cell.appendChild(evList);
      cell.addEventListener("click", () => openDayView(key));
      grid.appendChild(cell);
    }
  }

  function renderAll() {
    renderLegend();
    renderCalendar();
  }

  // ---------- Event Modal ----------
  const eventOverlay = document.getElementById("eventOverlay");
  const eventModalTitle = document.getElementById("eventModalTitle");
  const eventIdInput = document.getElementById("eventId");
  const eventTitleInput = document.getElementById("eventTitle");
  const eventDateInput = document.getElementById("eventDate");
  const eventTimeInput = document.getElementById("eventTime");
  const eventEndTimeInput = document.getElementById("eventEndTime");
  const eventCompletedInput = document.getElementById("eventCompleted");
  const eventColorOptions = document.getElementById("eventColorOptions");

  const classLocationField = document.getElementById("classLocationField");
  const eventClassLocationInput = document.getElementById("eventClassLocation");
  const examField = document.getElementById("examField");
  const eventIsExamInput = document.getElementById("eventIsExam");
  const dropdownLocationField = document.getElementById("dropdownLocationField");
  const dropdownLocationLabel = document.getElementById("dropdownLocationLabel");
  const eventLocationSelect = document.getElementById("eventLocationSelect");
  const otherLocationField = document.getElementById("otherLocationField");
  const eventOtherLocationInput = document.getElementById("eventOtherLocation");
  const errandDescField = document.getElementById("errandDescField");
  const eventErrandDescInput = document.getElementById("eventErrandDesc");
  const genericLocationField = document.getElementById("genericLocationField");
  const eventGenericLocationInput = document.getElementById("eventGenericLocation");

  const repeatField = document.getElementById("repeatField");
  const eventRepeatInput = document.getElementById("eventRepeat");
  const repeatOptions = document.getElementById("repeatOptions");
  const repeatDaysEl = document.getElementById("repeatDays");
  const repeatUntilInput = document.getElementById("repeatUntil");
  const repeatHint = document.getElementById("repeatHint");
  const deleteSeriesBtn = document.getElementById("deleteSeriesBtn");

  const DAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];
  let selectedRepeatDays = new Set();

  function renderRepeatDays() {
    repeatDaysEl.innerHTML = "";
    DAY_LABELS.forEach((label, idx) => {
      const btn = document.createElement("div");
      btn.className = "repeat-day-btn" + (selectedRepeatDays.has(idx) ? " selected" : "");
      btn.textContent = label;
      btn.addEventListener("click", () => {
        if (selectedRepeatDays.has(idx)) selectedRepeatDays.delete(idx);
        else selectedRepeatDays.add(idx);
        renderRepeatDays();
      });
      repeatDaysEl.appendChild(btn);
    });
  }

  function resetRepeatInputs() {
    eventRepeatInput.checked = false;
    repeatOptions.style.display = "none";
    selectedRepeatDays = new Set();
    repeatUntilInput.value = "";
    renderRepeatDays();
  }

  eventRepeatInput.addEventListener("change", () => {
    const checked = eventRepeatInput.checked;
    repeatOptions.style.display = checked ? "block" : "none";
    if (checked) {
      if (selectedRepeatDays.size === 0 && eventDateInput.value) {
        const d = new Date(eventDateInput.value + "T00:00:00");
        selectedRepeatDays.add(d.getDay());
        renderRepeatDays();
      }
      if (!repeatUntilInput.value) {
        repeatUntilInput.value = getDefaultRepeatUntil(eventDateInput.value);
      }
      repeatHint.textContent = "Defaults to SJSU's semester end date. Class events automatically skip SJSU holidays and breaks (Labor Day, Veteran's Day, Thanksgiving, Spring Recess).";
    }
  });

  function resetLocationInputs() {
    eventClassLocationInput.value = "";
    eventIsExamInput.checked = false;
    eventLocationSelect.value = "";
    eventOtherLocationInput.value = "";
    eventErrandDescInput.value = "";
    eventGenericLocationInput.value = "";
  }

  function updateOtherFieldVisibility() {
    otherLocationField.style.display = (eventLocationSelect.value === "Other") ? "block" : "none";
  }
  eventLocationSelect.addEventListener("change", updateOtherFieldVisibility);

  function updateLocationFieldsForCategory(categoryId) {
    classLocationField.style.display = "none";
    examField.style.display = "none";
    dropdownLocationField.style.display = "none";
    otherLocationField.style.display = "none";
    errandDescField.style.display = "none";
    genericLocationField.style.display = "none";

    if (categoryId === "class") {
      classLocationField.style.display = "block";
      examField.style.display = "flex";
    } else if (CATEGORY_SELECT_OPTIONS[categoryId]) {
      dropdownLocationField.style.display = "block";
      dropdownLocationLabel.textContent = "Location";
      eventLocationSelect.innerHTML = "";
      CATEGORY_SELECT_OPTIONS[categoryId].forEach(opt => {
        const o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        eventLocationSelect.appendChild(o);
      });
      updateOtherFieldVisibility();
    } else if (categoryId === "errands") {
      errandDescField.style.display = "block";
    } else {
      genericLocationField.style.display = "block";
    }
  }

  function resolveLocationAndExam() {
    let location = "";
    let isExam = false;
    if (selectedCategoryId === "class") {
      location = eventClassLocationInput.value.trim();
      isExam = eventIsExamInput.checked;
    } else if (CATEGORY_SELECT_OPTIONS[selectedCategoryId]) {
      const val = eventLocationSelect.value;
      location = (val === "Other") ? eventOtherLocationInput.value.trim() : val;
    } else if (selectedCategoryId === "errands") {
      location = eventErrandDescInput.value.trim();
    } else {
      location = eventGenericLocationInput.value.trim();
    }
    return { location, isExam };
  }
  const deleteEventBtn = document.getElementById("deleteEventBtn");
  const saveEventBtn = document.getElementById("saveEventBtn");
  const cancelEventBtn = document.getElementById("cancelEventBtn");

  let selectedCategoryId = null;

  function renderEventColorOptions() {
    eventColorOptions.innerHTML = "";
    state.categories.forEach(cat => {
      const sw = document.createElement("div");
      sw.className = "color-swatch" + (cat.id === selectedCategoryId ? " selected" : "");
      sw.style.background = cat.color;
      sw.title = cat.name;
      sw.addEventListener("click", () => {
        const changed = selectedCategoryId !== cat.id;
        selectedCategoryId = cat.id;
        renderEventColorOptions();
        if (changed) resetLocationInputs();
        updateLocationFieldsForCategory(selectedCategoryId);
      });
      eventColorOptions.appendChild(sw);
    });
  }

  function openEventModal(dateKey, eventId) {
    eventIdInput.value = eventId || "";
    eventDateInput.value = dateKey;
    resetLocationInputs();
    resetRepeatInputs();
    repeatField.style.display = eventId ? "none" : "block";

    if (eventId) {
      const ev = state.events.find(e => e.id === eventId);
      eventModalTitle.textContent = "Edit Event";
      eventTitleInput.value = ev.title;
      eventTimeInput.value = ev.time || "";
      eventEndTimeInput.value = ev.endTime || "";
      eventCompletedInput.checked = !!ev.completed;
      selectedCategoryId = ev.categoryId;
      updateLocationFieldsForCategory(selectedCategoryId);
      deleteSeriesBtn.style.display = ev.seriesId ? "inline-block" : "none";

      if (selectedCategoryId === "class") {
        eventClassLocationInput.value = ev.location || "";
        eventIsExamInput.checked = !!ev.isExam;
      } else if (CATEGORY_SELECT_OPTIONS[selectedCategoryId]) {
        const opts = CATEGORY_SELECT_OPTIONS[selectedCategoryId];
        if (ev.location && opts.includes(ev.location)) {
          eventLocationSelect.value = ev.location;
          updateOtherFieldVisibility();
        } else if (ev.location) {
          eventLocationSelect.value = "Other";
          otherLocationField.style.display = "block";
          eventOtherLocationInput.value = ev.location;
        }
      } else if (selectedCategoryId === "errands") {
        eventErrandDescInput.value = ev.location || "";
      } else {
        eventGenericLocationInput.value = ev.location || "";
      }

      deleteEventBtn.style.visibility = "visible";
    } else {
      eventModalTitle.textContent = "New Event";
      eventTitleInput.value = "";
      eventTimeInput.value = "";
      eventEndTimeInput.value = "";
      eventCompletedInput.checked = false;
      selectedCategoryId = state.categories[0].id;
      updateLocationFieldsForCategory(selectedCategoryId);
      deleteEventBtn.style.visibility = "hidden";
      deleteSeriesBtn.style.display = "none";
    }
    renderEventColorOptions();
    eventOverlay.classList.add("open");
    setTimeout(() => eventTitleInput.focus(), 50);
  }

  function closeEventModal() {
    eventOverlay.classList.remove("open");
  }

  function flashError(input) {
    input.classList.add("input-error");
    input.focus();
    setTimeout(() => input.classList.remove("input-error"), 1200);
  }

  saveEventBtn.addEventListener("click", () => {
    const title = eventTitleInput.value.trim();
    if (!title) { flashError(eventTitleInput); return; }
    const date = eventDateInput.value;
    if (!date) { flashError(eventDateInput); return; }
    const time = eventTimeInput.value;
    if (!time) { flashError(eventTimeInput); return; }
    const endTime = eventEndTimeInput.value;
    if (endTime && endTime <= time) { flashError(eventEndTimeInput); return; }
    const { location, isExam } = resolveLocationAndExam();
    const completed = eventCompletedInput.checked;
    const id = eventIdInput.value;

    if (id) {
      const ev = state.events.find(e => e.id === id);
      ev.title = title;
      ev.date = date;
      ev.time = time;
      ev.endTime = endTime;
      ev.location = location;
      ev.isExam = isExam;
      ev.completed = completed;
      ev.categoryId = selectedCategoryId;
    } else if (eventRepeatInput.checked && selectedRepeatDays.size > 0) {
      const seriesId = uid();
      const skipHolidays = selectedCategoryId === "class";
      const dates = generateSeriesDates(date, repeatUntilInput.value || date, selectedRepeatDays, skipHolidays);
      dates.forEach(d => {
        state.events.push({ id: uid(), seriesId, title, date: d, time, endTime, location, isExam, completed: false, categoryId: selectedCategoryId });
      });
    } else {
      state.events.push({ id: uid(), title, date, time, endTime, location, isExam, completed, categoryId: selectedCategoryId });
    }
    saveData();
    renderCalendar();
    if (currentDayKey) renderDaySchedule(currentDayKey);
    closeEventModal();
  });

  deleteEventBtn.addEventListener("click", () => {
    const id = eventIdInput.value;
    if (id) {
      state.events = state.events.filter(e => e.id !== id);
      saveData();
      renderCalendar();
      if (currentDayKey) renderDaySchedule(currentDayKey);
    }
    closeEventModal();
  });

  deleteSeriesBtn.addEventListener("click", () => {
    const id = eventIdInput.value;
    const ev = state.events.find(e => e.id === id);
    if (ev && ev.seriesId) {
      const count = state.events.filter(e => e.seriesId === ev.seriesId).length;
      if (confirm(`Delete all ${count} events in this series?`)) {
        state.events = state.events.filter(e => e.seriesId !== ev.seriesId);
        saveData();
        renderCalendar();
        if (currentDayKey) renderDaySchedule(currentDayKey);
        closeEventModal();
      }
    }
  });

  cancelEventBtn.addEventListener("click", closeEventModal);
  eventOverlay.addEventListener("click", (e) => { if (e.target === eventOverlay) closeEventModal(); });

  document.getElementById("newEventBtn").addEventListener("click", () => {
    openEventModal(currentDayKey || todayKey(), null);
  });

  // ---------- Day View ----------
  const monthView = document.getElementById("monthView");
  const dayView = document.getElementById("dayView");
  const dayViewTitle = document.getElementById("dayViewTitle");
  const daySchedule = document.getElementById("daySchedule");
  const HOUR_HEIGHT = 60;

  let currentDayKey = null;

  function minutesFromTime(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function formatHourLabel(hour) {
    const period = hour < 12 ? "AM" : "PM";
    let h = hour % 12;
    if (h === 0) h = 12;
    return `${h} ${period}`;
  }

  function openDayView(dateKey) {
    currentDayKey = dateKey;
    monthView.style.display = "none";
    dayView.style.display = "block";
    renderDaySchedule(dateKey);
    renderTasks(dateKey);
  }

  function closeDayView() {
    currentDayKey = null;
    dayView.style.display = "none";
    monthView.style.display = "block";
    renderCalendar();
  }

  function renderDaySchedule(dateKey) {
    const d = new Date(dateKey + "T00:00:00");
    dayViewTitle.textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    daySchedule.innerHTML = "";
    for (let h = 0; h < 24; h++) {
      const row = document.createElement("div");
      row.className = "hour-row";

      const label = document.createElement("div");
      label.className = "hour-label";
      label.textContent = formatHourLabel(h);
      row.appendChild(label);

      const slot = document.createElement("div");
      slot.className = "hour-slot";
      slot.addEventListener("click", () => {
        openEventModal(dateKey, null);
        eventTimeInput.value = `${String(h).padStart(2, "0")}:00`;
        eventEndTimeInput.value = `${String((h + 1) % 24).padStart(2, "0")}:00`;
      });
      row.appendChild(slot);

      daySchedule.appendChild(row);
    }

    const layer = document.createElement("div");
    layer.className = "day-events-layer";
    const dayEvents = state.events.filter(e => e.date === dateKey);

    dayEvents.forEach(ev => {
      const startMins = minutesFromTime(ev.time);
      const endMins = ev.endTime ? minutesFromTime(ev.endTime) : startMins + 30;
      const durationPx = Math.max((endMins - startMins) / 60 * HOUR_HEIGHT - 4, 22);
      const block = document.createElement("div");
      block.className = "day-event-block" + (ev.completed ? " completed" : "");
      block.style.background = getEventColor(ev);
      block.style.top = `${(startMins / 60) * HOUR_HEIGHT + 2}px`;
      block.style.height = `${durationPx}px`;

      const titleRow = document.createElement("div");
      titleRow.className = "day-event-block-title";

      const check = document.createElement("span");
      check.className = "event-check";
      check.textContent = ev.completed ? "✓" : "";
      check.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleCompleted(ev.id);
      });
      titleRow.appendChild(check);

      const titleText = document.createElement("span");
      const timeLabel = ev.time + (ev.endTime ? " – " + ev.endTime : "");
      titleText.textContent = `${timeLabel} · ${ev.title}`;
      titleRow.appendChild(titleText);

      block.appendChild(titleRow);

      if (ev.location) {
        const locRow = document.createElement("div");
        locRow.className = "day-event-block-location";
        locRow.textContent = ev.location;
        block.appendChild(locRow);
      }

      block.addEventListener("click", (e) => {
        e.stopPropagation();
        openEventModal(dateKey, ev.id);
      });
      layer.appendChild(block);
    });

    daySchedule.appendChild(layer);

    const scrollHour = dayEvents.length
      ? Math.max(0, Math.min(...dayEvents.map(e => minutesFromTime(e.time))) / 60 - 1)
      : 7;
    daySchedule.scrollTop = scrollHour * HOUR_HEIGHT;
  }

  document.getElementById("dayBackBtn").addEventListener("click", closeDayView);
  document.getElementById("dayAddEventBtn").addEventListener("click", () => {
    openEventModal(currentDayKey, null);
  });

  // ---------- Tasks ----------
  const taskInput = document.getElementById("taskInput");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const tasksList = document.getElementById("tasksList");

  function renderTasks(dateKey) {
    tasksList.innerHTML = "";
    const dayTasks = state.tasks.filter(t => t.date === dateKey);

    if (dayTasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "tasks-empty";
      empty.textContent = "No tasks yet.";
      tasksList.appendChild(empty);
      return;
    }

    dayTasks.forEach(task => {
      const item = document.createElement("div");
      item.className = "task-item" + (task.completed ? " completed" : "");

      const check = document.createElement("div");
      check.className = "task-check";
      check.textContent = task.completed ? "✓" : "";
      check.addEventListener("click", () => toggleTaskCompleted(task.id));
      item.appendChild(check);

      const text = document.createElement("div");
      text.className = "task-text";
      text.textContent = task.text;
      text.addEventListener("click", () => toggleTaskCompleted(task.id));
      item.appendChild(text);

      const del = document.createElement("div");
      del.className = "task-delete";
      del.textContent = "×";
      del.addEventListener("click", () => deleteTask(task.id));
      item.appendChild(del);

      tasksList.appendChild(item);
    });
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text || !currentDayKey) return;
    state.tasks.push({ id: uid(), date: currentDayKey, text, completed: false });
    taskInput.value = "";
    saveData();
    renderTasks(currentDayKey);
  }

  function toggleTaskCompleted(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    task.completed = !task.completed;
    saveData();
    renderTasks(currentDayKey);
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveData();
    renderTasks(currentDayKey);
  }

  addTaskBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTask();
  });

  // ---------- Category Modal ----------
  const catOverlay = document.getElementById("catOverlay");
  const catNameInput = document.getElementById("catName");
  const catColorOptions = document.getElementById("catColorOptions");
  let selectedCatColor = PALETTE[0];

  function renderCatColorOptions() {
    catColorOptions.innerHTML = "";
    PALETTE.forEach(color => {
      const sw = document.createElement("div");
      sw.className = "color-swatch" + (color === selectedCatColor ? " selected" : "");
      sw.style.background = color;
      sw.addEventListener("click", () => {
        selectedCatColor = color;
        renderCatColorOptions();
      });
      catColorOptions.appendChild(sw);
    });
  }

  function openCatModal() {
    catNameInput.value = "";
    selectedCatColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    renderCatColorOptions();
    catOverlay.classList.add("open");
    setTimeout(() => catNameInput.focus(), 50);
  }

  document.getElementById("cancelCatBtn").addEventListener("click", () => catOverlay.classList.remove("open"));
  catOverlay.addEventListener("click", (e) => { if (e.target === catOverlay) catOverlay.classList.remove("open"); });

  document.getElementById("saveCatBtn").addEventListener("click", () => {
    const name = catNameInput.value.trim();
    if (!name) { catNameInput.focus(); return; }
    state.categories.push({ id: uid(), name, color: selectedCatColor });
    saveData();
    renderAll();
    catOverlay.classList.remove("open");
  });

  // ---------- Nav ----------
  document.getElementById("prevBtn").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    viewDate = new Date();
    viewDate.setDate(1);
    renderCalendar();
  });

  // Escape key closes any open modal
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeEventModal();
      catOverlay.classList.remove("open");
    }
  });

  renderAll();
})();
</script>
</body>
</html>
